<form action="https://formsubmit.co/goddessbutterflyllc@gmail.com"
      method="POST"
      enctype="multipart/form-data">

<h3>Customer Information</h3>

<input type="text" name="Full Name" placeholder="Full Name" required><br><br>

<input type="tel" name="Phone" placeholder="Phone Number" required><br><br>

<input type="email" name="Email" placeholder="Email Address" required><br><br>

<h3>Order Details</h3>

<select name="Product" required>
    <option value="">Select a Product</option>
    <option>Custom T-Shirt</option>
    <option>Custom Hoodie</option>
    <option>Sweatshirt</option>
    <option>DTF Transfer</option>
    <option>Embroidery</option>
</select><br><br>

<input type="text" name="Shirt Color" placeholder="Shirt Color"><br><br>

<input type="text" name="Size" placeholder="Size(s)"><br><br>

<input type="number" name="Quantity" placeholder="Quantity" min="1"><br><br>

<input type="date" name="Needed By"><br><br>

<h3>Upload Your Design</h3>

<input type="file"
       name="attachment"
       accept=".jpg,.jpeg,.png,.pdf,.svg,.ai"><br><br>

<textarea name="Design Details"
          rows="6"
          placeholder="Describe your design, text, colors, placement, and any other details."></textarea><br><br>

<input type="hidden" name="_subject" value="New Goddess Butterfly Order Request">

<button class="button" type="submit">
Submit Order Request
</button>

</form>
